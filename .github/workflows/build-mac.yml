name: Build macOS DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check the Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: brew install ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Run the complete test suite
        run: node scripts/ci-command.cjs npm test
      - run: node scripts/ci-command.cjs npm run dist:mac
      - name: Verify the DMG and launch the packaged app
        run: node scripts/ci-command.cjs node scripts/verify-dmg.mjs dist/ElpoAiAutoCapcut-0.5.0-arm64.dmg
      - name: Compute the download checksum
        run: cd dist && shasum -a 256 ElpoAiAutoCapcut-0.5.0-arm64.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ElpoAiAutoCapcut-dmg
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/dmg-validation.json
      - name: Attach the DMG to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/dmg-validation.json
